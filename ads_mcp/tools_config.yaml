# tools_config.yaml
#
# Tools configuration for the Google Ads MCP server.
# Modify this file to enable/disable tool namespaces or set custom prefixes.

namespaces:
  customers: true
  search: true
  metadata: true
  # Write tools. Every one of them is a dry run (validate_only) unless the
  # caller passes confirm=True. Set to false to run the server read-only.
  mutate: true
